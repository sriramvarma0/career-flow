name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate-and-push:
    name: Validate, Build, and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'career-flow' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry (Custom Registry)
        if: env.REGISTRY != ''
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | tr -d '\r\n' | docker login "${{ env.REGISTRY }}" -u "$(echo "${{ env.REGISTRY_USERNAME }}" | tr -d '[:space:]')" --password-stdin

      - name: Log in to Docker Hub
        if: env.REGISTRY == ''
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | tr -d '\r\n' | docker login -u "$(echo "${{ env.REGISTRY_USERNAME }}" | tr -d '[:space:]')" --password-stdin

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY != '' && format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) || format('{0}/{1}', env.REGISTRY_USERNAME, env.IMAGE_NAME) }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max